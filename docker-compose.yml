services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 5000"
    environment:
      - MAX_TRAIN_ROWS=120000
      # Optional shared secret between backend and ML service.
      - ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN:-}
    volumes:
      - ./ml-service:/app
      - ./breast_cancer_40_features_1M.csv:/breast_cancer_40_features_1M.csv:ro
    # Not published to the host: only backend talks to it over the compose network.
    expose:
      - "5000"

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/breast_cancer_ai
      - NODE_ENV=development
      # Required: generate with `node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"`
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your shell or .env file}
      - FRONTEND_ORIGIN=http://localhost:5173
      - ML_SERVICE_URL=http://ml-service:5000
      - ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN:-}
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - ml-service

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
